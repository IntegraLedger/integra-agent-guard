name: ci
on: [push]        # work lands directly on main; there is no PR surface to trigger on

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.9    # no version input — package.json's packageManager is the single source of truth
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec lcp-conformance   # seam canary: proves @integraledger/lcp-* installs and runs from npmjs here, where a broken publish would otherwise hide
      - run: pnpm verify        # verify builds first (pnpm -r build): workspace packages consume each other via built dist/
      - run: pnpm -r exec publint
      - run: pnpm -r exec attw --pack . --profile esm-only   # packages are ESM-only
